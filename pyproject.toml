[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Natural language to structured function calls"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pydantic>=2,<3",
    "llm-sdk",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
